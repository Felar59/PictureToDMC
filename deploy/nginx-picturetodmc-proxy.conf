# Shared proxy body for the Picture to DMC server blocks.
# Installed at /etc/nginx/snippets/picturetodmc-proxy.conf.

# Uploads arrive as a base64 data URL inside a JSON body, so a photo weighs
# roughly 4/3 of its file size. nginx's 1m default rejected them outright.
client_max_body_size 25m;

# Worth a lot here: /white_mask answers with one base64 PNG per thread, and
# base64 compresses extremely well. text/javascript matters too — that is the
# type Starlette returns for the Vite bundle.
gzip on;
gzip_types application/json application/javascript text/javascript
           text/css text/plain image/svg+xml application/manifest+json;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;

location / {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # KMeans on a large photo can take a while on 2 vCPU; the default 60s
    # read timeout would cut a legitimate conversion short.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
}

# Picture to DMC — public entry points.
#
# __HOST__ is substituted by deploy/enable-https.sh. Today it is a sslip.io
# hostname (free wildcard DNS that resolves straight back to this IP), which
# is enough for Let's Encrypt to issue a genuinely trusted certificate without
# owning a domain. To move to a real domain later: point its A record here and
# re-run enable-https.sh with the new name.
#
# The box also serves emoji-art on 80/443; nginx picks between them by
# server_name, so these blocks only ever answer for __HOST__.

# 1) http -> https, and the ACME challenge that renews the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name __HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2) The site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # No HSTS on purpose: this hostname is temporary, and pinning browsers to
    # https for a name that is going to be thrown away causes more grief than
    # it prevents. Add it once the real domain is in place.

    access_log /var/log/nginx/picturetodmc.access.log;
    error_log  /var/log/nginx/picturetodmc.error.log;

    include /etc/nginx/snippets/picturetodmc-proxy.conf;
}

# 3) The old http://IP:8080 entry point, kept so existing links still land
#    somewhere useful. It only redirects — the app is served over TLS only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://__HOST__$request_uri;
}

# Picture to DMC — public entry point.
#
# The VPS already serves emoji-art on 80/443 by server_name, so this site gets
# its own port instead of a hostname. Swap `listen 8080` for a 443 block with
# a server_name and a certificate the day it gets a domain.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Uploads arrive as a base64 data URL inside a JSON body, so a photo weighs
    # roughly 4/3 of its file size. nginx's 1m default rejected them outright.
    client_max_body_size 25m;

    # Worth a lot here: /white_mask answers with one base64 PNG per thread, and
    # base64 compresses extremely well.
    gzip on;
    # text/javascript, not just application/javascript: that is the type
    # Starlette actually returns for the Vite bundle, and without it the
    # 320 KB of JS went out uncompressed.
    gzip_types application/json application/javascript text/javascript
               text/css text/plain image/svg+xml application/manifest+json;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;

    access_log /var/log/nginx/picturetodmc.access.log;
    error_log  /var/log/nginx/picturetodmc.error.log;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # KMeans on a large photo can take a while on 2 vCPU; the default 60s
        # read timeout would cut a legitimate conversion short.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

# La Vallée des Points de Croix — public entry points.
#
# __HOST__ is the canonical name and __SERVER_NAMES__ every name the certificate
# covers; both are substituted by deploy/enable-https.sh. To move to a different
# name later: point its A/AAAA records here and re-run that script with the new
# name first on the command line.
#
# The box also serves emoji-art on 80/443; nginx picks between them by
# server_name, so these blocks only ever answer for the names listed here.

# 1) http -> https, and the ACME challenge that renews the certificate.
#
# Every name is listed, not just the canonical one: an alias has to be able to
# answer its own challenge, or certbot cannot renew the certificate that carries
# it. The redirect goes straight to the canonical host rather than to $host, so
# an alias arrives at the right name in one hop instead of two.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAMES__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://__HOST__$request_uri;
    }
}

__ALIAS_BLOCK__
# 2) The site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __HOST__;

    ssl_certificate     /etc/letsencrypt/live/__HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__HOST__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS, now that the name is a real one and permanent. It was deliberately
    # absent while the host was a throwaway sslip.io address: pinning browsers to
    # https for a name about to be discarded causes more grief than it prevents.
    #
    # A year, and deliberately WITHOUT `includeSubDomains` or `preload`. Both are
    # one-way doors — a subdomain serving anything over http would break, and
    # preload removal takes months — and neither buys anything here, where there
    # is one host and it has been https-only from its first day.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/picturetodmc.access.log;
    error_log  /var/log/nginx/picturetodmc.error.log;

    include /etc/nginx/snippets/picturetodmc-proxy.conf;
}

# 3) The old http://IP:8080 entry point, kept so existing links still land
#    somewhere useful. It only redirects — the app is served over TLS only.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    return 301 https://__HOST__$request_uri;
}
